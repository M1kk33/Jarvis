<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Jarvis</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/voice_player.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">J</span> Jarvis</div>
      <button id="new-conversation" class="new-chat" type="button"><span aria-hidden="true">＋</span> Новый диалог</button>
      <h2>Ваши диалоги</h2>
      <nav id="conversations" aria-label="Диалоги"></nav>
    </aside>
    <main class="chat">
      <header>
        <div class="heading"><h1 id="conversation-title">Новый диалог</h1></div>
        <div class="header-actions">
          <button id="stop-voice" type="button" class="quiet" hidden>Остановить голос</button>
          <button id="refresh" type="button" class="icon-button" title="Обновить" aria-label="Обновить">↻</button>
          <button id="toggle-activity" type="button" class="quiet" aria-expanded="false" aria-controls="activity-panel">Действия <span id="approval-count" class="count" hidden>0</span></button>
        </div>
      </header>
      <div class="voice-line"><span id="voice-status" role="status"></span></div>
      <div id="messages" class="messages" aria-live="polite"></div>
      <div class="composer-wrap">
        <form id="send-form" class="composer">
          <label for="message-input" class="sr-only">Сообщение</label>
          <div class="composer-row">
            <div id="vision-controls" class="attachment-controls" hidden>
              <button id="attach-image" class="composer-icon quiet" type="button" title="Прикрепить изображение · Ctrl + V или перетащите сюда" aria-label="Прикрепить изображение">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <input id="screenshot-input" class="sr-only" type="file" accept="image/png,image/jpeg,image/webp" aria-label="Выбрать изображение">
            </div>
            <textarea id="message-input" rows="1" maxlength="65536" placeholder="Спросить Jarvis" required></textarea>
            <div class="composer-actions">
              <div id="speech-controls" class="speech-controls" hidden>
                <button id="record-button" type="button" class="composer-icon quiet" title="Записать голос" aria-label="Записать голос">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3M9 22h6"/></svg>
                </button>
                <button id="stop-recording" type="button" class="composer-icon" title="Завершить запись" aria-label="Завершить запись" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                </button>
                <button id="cancel-transcription" type="button" class="composer-icon quiet" title="Отменить распознавание" aria-label="Отменить распознавание" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
                </button>
              </div>
              <button id="send-button" class="composer-icon" type="submit" title="Отправить (Enter)" aria-label="Отправить">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </div>
          </div>
          <div id="attachment-preview" class="attachment-preview" hidden>
            <img id="screenshot-preview" alt="Выбранный скриншот" hidden>
            <span id="screenshot-status" role="status"></span>
            <button id="remove-screenshot" class="quiet" type="button" hidden>Убрать скриншот</button>
            <span class="subtle">Скриншот сохранится в диалоге и резервных копиях. Удаление скриншотов пока не предусмотрено.</span>
          </div>
          <div id="speech-status" class="composer-status" role="status"></div>
        </form>
        <p id="notice" class="notice" role="status"></p>
      </div>
    </main>
    <aside id="activity-panel" class="activity" hidden>
      <div class="activity-heading"><h2>Действия</h2><button id="close-activity" type="button" class="icon-button" aria-label="Закрыть панель действий">×</button></div>
      <h3>Требуют внимания</h3><div id="approvals"></div>
      <h3>Ход работы</h3><div id="jobs"></div>
    </aside>
  </div>
</body>
</html>
