<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открыть Jarvis</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body class="setup-page">
  <main class="setup-card">
    <div class="brand">Jarvis</div>
    <h1>Ваш личный помощник</h1>
    <p>Приложение войдёт автоматически. Если вы запустили сервер вручную, введите одноразовый код из терминала.</p>
    <form id="setup-form">
      <label for="setup-token">Одноразовый код</label>
      <input id="setup-token" type="password" autocomplete="off" required autofocus>
      <button type="submit">Открыть Jarvis</button>
    </form>
    <p id="notice" class="notice" role="status"></p>
  </main>
</body>
</html>
