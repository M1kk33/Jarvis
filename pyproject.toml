[project]
name = "jarvis"
version = "0.1.0"
description = "A local-first assistant with durable terminal chat and a pinned local text model"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "psutil>=7,<8",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9,<10",
    "ruff>=0.16.10",
    "types-psutil>=7,<8",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
